<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema Hospitalar - Busca</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Menu Superior (JMenuBar) -->
    <nav class="menu-bar">
        <a href="cadastro.html">Cadastro</a>
        <a href="busca.html">Busca</a>
        <a href="index.html">Sair</a>
    </nav>

    <!-- Área Principal -->
    <main>
        <div class="app-window" style="max-width: 820px;">
            <!-- Barra de Título da Janela -->
            <div class="window-titlebar">
                <span>BUSCAR PACIENTES</span>
                <span>_ X</span>
            </div>
            
            <div class="window-body" style="gap: 15px;">
                
                <!-- Caixa Superior: Filtros de Pesquisa Lado a Lado -->
                <div style="background-color: #eef0f4; border: 1px solid #a6aebc; padding: 12px; border-radius: 3px; display: grid; grid-template-columns: 220px 1fr; gap: 20px;">
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="text-align: left; font-weight: 600;">Pesquisar por:</label>
                        <select id="cbTipoBusca">
                            <option value="nome">Nome</option>
                            <option value="codigo">Código Paciente</option>
                            <option value="cpf">CPF</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="text-align: left; font-weight: 600;">Valor para pesquisar:</label>
                        <input type="text" id="txtValorBusca" placeholder="Digite para filtrar...">
                    </div>
                </div>

                <!-- Tabela de Resultados (JTable com Borda Rebaixada) -->
                <div style="border: 1px solid #7f8c8d; background: white; max-height: 220px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 80px;">Código</th>
                                <th>Nome</th>
                                <th style="width: 140px;">CPF</th>
                                <th style="width: 130px;">Telefone</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaPacientes">
                            <!-- Os dados serão preenchidos dinamicamente pelo JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Botões Inferiores Separados (Esquerda e Direita) -->
                <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                    <button type="button" id="btnLimparBusca" class="btn" style="width: 130px;">Limpar Busca</button>
                    <button type="button" id="btnTodosPacientes" class="btn" style="width: 130px;">Todos Pacientes</button>
                </div>

            </div>
        </div>
    </main>

    <script src="js/busca.js"></script>
</body>
</html>
